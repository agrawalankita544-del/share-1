<style>
body{margin:0}
a{color:#9F2089}a:hover{color:#9F2089}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid #5585F8;outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes drift{from{opacity:0;transform:translateY(-24px) rotate(0deg)}to{opacity:1;transform:translateY(0) rotate(var(--r))}}

.fade{animation:fade .25s ease}
.rise{animation:rise .25s ease}
.up{animation:up .34s cubic-bezier(.2,.8,.2,1)}
.pop{animation:pop .6s .25s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.fade,.rise,.up,.pop{animation:none}}
</style>

<div id="stage"><div id="fit"><div id="app"></div></div></div>
<template id="tpl">
<div style="width: 820px; height: 840px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; align-items: flex-start; background: #EAEAF2; font-family: Inter, system-ui, sans-serif; color: #353543">

<!-- ===== FLOW STEPS ===== -->
<div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-radius: 16px; padding: 20px; box-sizing: border-box; border: 1px solid #CECEDE">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; font-weight: 600; color: #9F2089">From Figma · Version 1 (219:93409)</div>
    <div style="font-size: 18px; font-weight: 700; line-height: 1.3">Version 1 · commission link below the share options</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
      <button onClick="{{st.go}}" aria-current="{{st.current}}" style="{{st.style}}">
